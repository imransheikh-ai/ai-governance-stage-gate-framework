<svg width="1240" height="360" viewBox="0 0 1240 360" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1240" height="360" fill="#F6F2E7"/>

  <text x="620" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1D1B">AI Governance Stage-Gate Model</text>
  <text x="620" y="62" text-anchor="middle" font-size="13" fill="#655C4E">Six checkpoints an AI idea must pass, from first proposal to full-scale production</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B08D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- connectors -->
  <line x1="200" y1="195" x2="224" y2="195" stroke="#B08D2E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="404" y1="195" x2="428" y2="195" stroke="#B08D2E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="608" y1="195" x2="632" y2="195" stroke="#B08D2E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="812" y1="195" x2="836" y2="195" stroke="#B08D2E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1016" y1="195" x2="1040" y2="195" stroke="#B08D2E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate 1 -->
  <circle cx="110" cy="95" r="19" fill="#7A1620"/>
  <text x="110" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#F6F2E7">1</text>
  <rect x="20" y="140" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#C9BFA0" stroke-width="1"/>
  <text x="110" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Investment</text>
  <text x="110" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Prioritization</text>
  <text x="110" y="210" text-anchor="middle" font-size="11.5" fill="#655C4E">Is this idea worth</text>
  <text x="110" y="226" text-anchor="middle" font-size="11.5" fill="#655C4E">funding compared</text>
  <text x="110" y="242" text-anchor="middle" font-size="11.5" fill="#655C4E">to other ideas?</text>

  <!-- Gate 2 -->
  <circle cx="314" cy="95" r="19" fill="#7A1620"/>
  <text x="314" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#F6F2E7">2</text>
  <rect x="224" y="140" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#C9BFA0" stroke-width="1"/>
  <text x="314" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Business Case</text>
  <text x="314" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Approval</text>
  <text x="314" y="210" text-anchor="middle" font-size="11.5" fill="#655C4E">Will the benefits</text>
  <text x="314" y="226" text-anchor="middle" font-size="11.5" fill="#655C4E">really outweigh the</text>
  <text x="314" y="242" text-anchor="middle" font-size="11.5" fill="#655C4E">cost and effort?</text>

  <!-- Gate 3 -->
  <circle cx="518" cy="95" r="19" fill="#7A1620"/>
  <text x="518" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#F6F2E7">3</text>
  <rect x="428" y="140" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#C9BFA0" stroke-width="1"/>
  <text x="518" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Architecture &amp;</text>
  <text x="518" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Data Readiness</text>
  <text x="518" y="210" text-anchor="middle" font-size="11.5" fill="#655C4E">Is the data clean,</text>
  <text x="518" y="226" text-anchor="middle" font-size="11.5" fill="#655C4E">available, and the</text>
  <text x="518" y="242" text-anchor="middle" font-size="11.5" fill="#655C4E">design sound?</text>

  <!-- Gate 4 -->
  <circle cx="722" cy="95" r="19" fill="#7A1620"/>
  <text x="722" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#F6F2E7">4</text>
  <rect x="632" y="140" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#C9BFA0" stroke-width="1"/>
  <text x="722" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Security &amp;</text>
  <text x="722" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Risk Review</text>
  <text x="722" y="210" text-anchor="middle" font-size="11.5" fill="#655C4E">Could this leak data,</text>
  <text x="722" y="226" text-anchor="middle" font-size="11.5" fill="#655C4E">get hacked, or</text>
  <text x="722" y="242" text-anchor="middle" font-size="11.5" fill="#655C4E">behave unfairly?</text>

  <!-- Gate 5 -->
  <circle cx="926" cy="95" r="19" fill="#7A1620"/>
  <text x="926" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#F6F2E7">5</text>
  <rect x="836" y="140" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#C9BFA0" stroke-width="1"/>
  <text x="926" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Operational</text>
  <text x="926" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Acceptance</text>
  <text x="926" y="210" text-anchor="middle" font-size="11.5" fill="#655C4E">Is there a support and</text>
  <text x="926" y="226" text-anchor="middle" font-size="11.5" fill="#655C4E">monitoring plan for</text>
  <text x="926" y="242" text-anchor="middle" font-size="11.5" fill="#655C4E">daily real use?</text>

  <!-- Gate 6 -->
  <circle cx="1130" cy="95" r="19" fill="#7A1620"/>
  <text x="1130" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#F6F2E7">6</text>
  <rect x="1040" y="140" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#C9BFA0" stroke-width="1"/>
  <text x="1130" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Scaling</text>
  <text x="1130" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1D1B">Decision</text>
  <text x="1130" y="210" text-anchor="middle" font-size="11.5" fill="#655C4E">Did the pilot prove</text>
  <text x="1130" y="226" text-anchor="middle" font-size="11.5" fill="#655C4E">itself enough to roll</text>
  <text x="1130" y="242" text-anchor="middle" font-size="11.5" fill="#655C4E">out further?</text>

  <line x1="20" y1="285" x2="1220" y2="285" stroke="#C9BFA0" stroke-width="1"/>
  <text x="620" y="310" text-anchor="middle" font-size="12" fill="#655C4E">A project only moves right when its gate is signed off — not before.</text>
  <rect x="0" y="335" width="1240" height="6" fill="#7A1620"/>
</svg>
