<svg width="1240" height="520" viewBox="0 0 1240 520" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Risk Tiers: Scale the Rigor With the Risk">
<title>Risk Tiers: Scale the Rigor With the Risk</title>
<rect width="1240" height="520" fill="#F6F2E7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B08D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="620.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1D1B">Risk Tiers: Scale the Rigor With the Risk</text>
<text x="620.0" y="64" text-anchor="middle" font-size="13" fill="#655C4E">Assign a tier at intake. The tier sets how deep each of the six gates goes.</text>
<rect x="50" y="95" width="360" height="385" rx="10" fill="#FFFDF7" stroke="#D9CFB8" stroke-width="1.5"/>
<rect x="50" y="95" width="360" height="8" rx="4" fill="#1F4E4A"/>
<text x="78" y="138" text-anchor="start" font-size="12" font-weight="700" fill="#1F4E4A">TIER 1</text>
<text x="78" y="170" text-anchor="start" font-size="24" font-weight="700" fill="#1E1D1B">Low risk</text>
<circle cx="84" cy="205" r="4" fill="#B08D2E"/>
<text x="98" y="210" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Internal use only</text>
<circle cx="84" cy="233" r="4" fill="#B08D2E"/>
<text x="98" y="238" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">No personal or sensitive data</text>
<circle cx="84" cy="261" r="4" fill="#B08D2E"/>
<text x="98" y="266" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">A human reviews every output</text>
<line x1="78" y1="300" x2="382" y2="300" stroke="#D9CFB8" stroke-width="1"/>
<text x="78" y="332" text-anchor="start" font-size="11" font-weight="700" fill="#655C4E">HOW THE GATES RUN</text>
<text x="78" y="362" text-anchor="start" font-size="19" font-weight="700" fill="#1F4E4A">Fast track</text>
<text x="78" y="390" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Checklist only, signed by named</text>
<text x="78" y="409" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">delegates. Days, not weeks.</text>
<rect x="78" y="432" width="28" height="12" rx="3" fill="#1F4E4A"/>
<rect x="112" y="432" width="28" height="12" rx="3" fill="#E6DAB9"/>
<rect x="146" y="432" width="28" height="12" rx="3" fill="#E6DAB9"/>
<text x="190" y="443" text-anchor="start" font-size="12" font-weight="400" fill="#655C4E" font-style="italic">review depth</text>
<rect x="440" y="95" width="360" height="385" rx="10" fill="#FFFDF7" stroke="#D9CFB8" stroke-width="1.5"/>
<rect x="440" y="95" width="360" height="8" rx="4" fill="#B08D2E"/>
<text x="468" y="138" text-anchor="start" font-size="12" font-weight="700" fill="#B08D2E">TIER 2</text>
<text x="468" y="170" text-anchor="start" font-size="24" font-weight="700" fill="#1E1D1B">Medium risk</text>
<circle cx="474" cy="205" r="4" fill="#B08D2E"/>
<text x="488" y="210" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Uses customer or employee data</text>
<circle cx="474" cy="233" r="4" fill="#B08D2E"/>
<text x="488" y="238" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Human stays in the loop</text>
<circle cx="474" cy="261" r="4" fill="#B08D2E"/>
<text x="488" y="266" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Errors are caught before impact</text>
<line x1="468" y1="300" x2="772" y2="300" stroke="#D9CFB8" stroke-width="1"/>
<text x="468" y="332" text-anchor="start" font-size="11" font-weight="700" fill="#655C4E">HOW THE GATES RUN</text>
<text x="468" y="362" text-anchor="start" font-size="19" font-weight="700" fill="#B08D2E">Standard track</text>
<text x="468" y="390" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Each owning body reviews at its</text>
<text x="468" y="409" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">normal meeting.</text>
<rect x="468" y="432" width="28" height="12" rx="3" fill="#B08D2E"/>
<rect x="502" y="432" width="28" height="12" rx="3" fill="#B08D2E"/>
<rect x="536" y="432" width="28" height="12" rx="3" fill="#E6DAB9"/>
<text x="580" y="443" text-anchor="start" font-size="12" font-weight="400" fill="#655C4E" font-style="italic">review depth</text>
<rect x="830" y="95" width="360" height="385" rx="10" fill="#FFFDF7" stroke="#D9CFB8" stroke-width="1.5"/>
<rect x="830" y="95" width="360" height="8" rx="4" fill="#7A1620"/>
<text x="858" y="138" text-anchor="start" font-size="12" font-weight="700" fill="#7A1620">TIER 3</text>
<text x="858" y="170" text-anchor="start" font-size="24" font-weight="700" fill="#1E1D1B">High risk</text>
<circle cx="864" cy="205" r="4" fill="#B08D2E"/>
<text x="878" y="210" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Customer-facing or automated decisions</text>
<circle cx="864" cy="233" r="4" fill="#B08D2E"/>
<text x="878" y="238" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Sensitive data or regulated activity</text>
<circle cx="864" cy="261" r="4" fill="#B08D2E"/>
<text x="878" y="266" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Errors could harm people or the firm</text>
<line x1="858" y1="300" x2="1162" y2="300" stroke="#D9CFB8" stroke-width="1"/>
<text x="858" y="332" text-anchor="start" font-size="11" font-weight="700" fill="#655C4E">HOW THE GATES RUN</text>
<text x="858" y="362" text-anchor="start" font-size="19" font-weight="700" fill="#7A1620">Full track</text>
<text x="858" y="390" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">Committee reviews, independent</text>
<text x="858" y="409" text-anchor="start" font-size="13.5" font-weight="400" fill="#1E1D1B">testing, steering visibility.</text>
<rect x="858" y="432" width="28" height="12" rx="3" fill="#7A1620"/>
<rect x="892" y="432" width="28" height="12" rx="3" fill="#7A1620"/>
<rect x="926" y="432" width="28" height="12" rx="3" fill="#7A1620"/>
<text x="970" y="443" text-anchor="start" font-size="12" font-weight="400" fill="#655C4E" font-style="italic">review depth</text>
</svg>
